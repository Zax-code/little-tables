[package]
name = "lt-server"
description = "The little tables server: HTTP API, web app hosting, reminders and administration commands."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "little-tables"
path = "src/main.rs"

[dependencies]
axum.workspace = true
chrono = { workspace = true, features = ["clock"] }
chrono-tz.workspace = true
clap.workspace = true
lt-auth = { path = "../lt-auth" }
lt-domain = { path = "../lt-domain" }
lt-push = { path = "../lt-push" }
lt-store = { path = "../lt-store" }
mime_guess.workspace = true
percent-encoding = "2"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tempfile.workspace = true

[lints]
workspace = true
