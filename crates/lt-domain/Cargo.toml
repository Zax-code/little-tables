[package]
name = "lt-domain"
description = "little tables learning engine: mastery, sessions, exercises, garden. Pure and deterministic."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["tz"]
# Day keys from IANA time zones. The WebAssembly build leaves it out and asks the browser instead.
tz = ["dep:chrono-tz"]

[dependencies]
chrono.workspace = true
chrono-tz = { workspace = true, optional = true }
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
flate2.workspace = true
proptest.workspace = true

[lints]
workspace = true
