name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # The web app and the TypeScript packages, with the engine compiled to WebAssembly.
  web:
    name: Web app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The artwork sources (assets/generated, a quarter of a gigabyte) take no part in the checks.
          sparse-checkout: |
            /*
            !/assets/generated/
          sparse-checkout-cone-mode: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Install WebAssembly tools
        # Downloads stay outside the checkout, where formatting and linting would see them.
        working-directory: ${{ runner.temp }}
        env:
          BINARYEN_VERSION: 133
          WASM_BINDGEN_VERSION: 0.2.129
        run: |
          archive="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLO "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${archive}.tar.gz"
          curl -fsSLO "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${archive}.tar.gz.sha256sum"
          # The published checksum file names the archive by its release path; check the hash alone.
          expected=$(cut -d ' ' -f 1 "${archive}.tar.gz.sha256sum")
          printf '%s  %s\n' "$expected" "${archive}.tar.gz" | sha256sum --check
          tar -xzf "${archive}.tar.gz"
          sudo install -m 0755 "${archive}/wasm-bindgen" /usr/local/bin/wasm-bindgen
          binaryen="binaryen-version_${BINARYEN_VERSION}"
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${binaryen}-x86_64-linux.tar.gz"
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${binaryen}-x86_64-linux.tar.gz.sha256"
          sha256sum --check "${binaryen}-x86_64-linux.tar.gz.sha256"
          tar -xzf "${binaryen}-x86_64-linux.tar.gz"
          sudo install -m 0755 "${binaryen}/bin/wasm-opt" /usr/local/bin/wasm-opt

      - name: Build the WebAssembly engine
        run: pnpm --filter @little-tables/engine build:wasm

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload web app build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/app/dist/
          if-no-files-found: error
          retention-days: 1

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: crates

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The production binary, as deploy/deploy-little-tables-release.sh runs it.
  server:
    name: Server binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: crates

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Build release binary
        env:
          APP_REVISION: ${{ github.sha }}
        run: cargo build --release --locked -p lt-server

      - name: Upload server binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-binary
          path: target/release/little-tables
          if-no-files-found: error
          retention-days: 1

  # One archive per commit: the Rust server and the web app, as production runs them.
  release:
    name: Release archive
    needs: [web, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools

      - name: Download web app build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/app/dist

      - name: Download server binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-binary
          path: ${{ runner.temp }}/server

      - name: Package server release
        id: release
        env:
          LT_SERVER_BINARY: ${{ runner.temp }}/server/little-tables
        run: |
          archive=$(tools/package-release.sh "$GITHUB_SHA" target/release-archive | tail -n 1)
          echo "archive=$archive" >>"$GITHUB_OUTPUT"

      - name: Smoke-test server release
        run: tools/smoke-release.sh "${{ steps.release.outputs.archive }}" "$GITHUB_SHA"

      - name: Upload server release
        # Pull requests are smoke-tested but keep no archive; main commits are what gets deployed.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: little-tables-${{ github.sha }}
          path: target/release-archive/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy production
    # Merges deploy only while the repository variable DEPLOY_ON_MERGE is `true`
    # (deploy/RUST_CUTOVER_RUNBOOK.md).
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      vars.DEPLOY_ON_MERGE == 'true'
    needs: [rust, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: https://math.leaetzak.love
    steps:
      - name: Download server release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: little-tables-${{ github.sha }}
          path: release

      - name: Configure restricted deployment key
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" >~/.ssh/little-tables-deploy
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/little-tables-deploy ~/.ssh/known_hosts

      # The VPS checks the archive against its checksum, backs up, migrates, switches and
      # health-checks, rolling back on failure (deploy/deploy-little-tables-release.sh).
      - name: Deploy with health-check rollback
        run: |
          archive="little-tables-${GITHUB_SHA}.tar.gz"
          (cd release && sha256sum --check "$archive.sha256")
          checksum=$(cut -d ' ' -f 1 "release/$archive.sha256")
          ssh -i ~/.ssh/little-tables-deploy -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" "deploy-release ${GITHUB_SHA} ${checksum}" <"release/$archive"

      - name: Verify public deployment
        run: |
          response=$(ssh -i ~/.ssh/little-tables-deploy -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" public-health)
          printf '%s\n' "$response"
          jq --exit-status --arg revision "$GITHUB_SHA" '.status == "ready" and .revision == $revision' <<<"$response"
