name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: little-tables-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PNPM_VERSION: 11.2.2

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install WebAssembly tools
        # Downloads stay outside the checkout, where formatting and linting would see them.
        working-directory: ${{ runner.temp }}
        env:
          BINARYEN_VERSION: 133
          WASM_BINDGEN_VERSION: 0.2.129
        run: |
          archive="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLO "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${archive}.tar.gz"
          curl -fsSLO "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${archive}.tar.gz.sha256sum"
          # The published checksum file names the archive by its release path; check the hash alone.
          expected=$(cut -d ' ' -f 1 "${archive}.tar.gz.sha256sum")
          printf '%s  %s\n' "$expected" "${archive}.tar.gz" | sha256sum --check
          tar -xzf "${archive}.tar.gz"
          sudo install -m 0755 "${archive}/wasm-bindgen" /usr/local/bin/wasm-bindgen
          binaryen="binaryen-version_${BINARYEN_VERSION}"
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${binaryen}-x86_64-linux.tar.gz"
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${binaryen}-x86_64-linux.tar.gz.sha256"
          sha256sum --check "${binaryen}-x86_64-linux.tar.gz.sha256"
          tar -xzf "${binaryen}-x86_64-linux.tar.gz"
          sudo install -m 0755 "${binaryen}/bin/wasm-opt" /usr/local/bin/wasm-opt

      - name: Run checks and build
        run: pnpm check

      # One archive per commit: the Rust server and the web app, as production runs them.
      - name: Package server release
        id: release
        run: |
          archive=$(tools/package-release.sh "$GITHUB_SHA" target/release-archive | tail -n 1)
          echo "archive=$archive" >>"$GITHUB_OUTPUT"

      - name: Smoke-test server release
        run: tools/smoke-release.sh "${{ steps.release.outputs.archive }}" "$GITHUB_SHA"

      - name: Upload server release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-tables-${{ github.sha }}
          path: target/release-archive/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy production
    # Paused while the rewrite runs in pre-production: merges are verified but not deployed.
    # Set the repository variable DEPLOY_ON_MERGE to `true` to deploy again, once production runs
    # the Rust server (deploy/RUST_CUTOVER_RUNBOOK.md).
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      vars.DEPLOY_ON_MERGE == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: https://math.leaetzak.love
    steps:
      - name: Download server release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: little-tables-${{ github.sha }}
          path: release

      - name: Configure restricted deployment key
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" >~/.ssh/little-tables-deploy
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/little-tables-deploy ~/.ssh/known_hosts

      # The VPS checks the archive against its checksum, backs up, migrates, switches and
      # health-checks, rolling back on failure (deploy/deploy-little-tables-release.sh).
      - name: Deploy with health-check rollback
        run: |
          archive="little-tables-${GITHUB_SHA}.tar.gz"
          (cd release && sha256sum --check "$archive.sha256")
          checksum=$(cut -d ' ' -f 1 "release/$archive.sha256")
          ssh -i ~/.ssh/little-tables-deploy -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" "deploy-release ${GITHUB_SHA} ${checksum}" <"release/$archive"

      - name: Verify public deployment
        run: |
          response=$(ssh -i ~/.ssh/little-tables-deploy -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" public-health)
          printf '%s\n' "$response"
          jq --exit-status --arg revision "$GITHUB_SHA" '.status == "ready" and .revision == $revision' <<<"$response"
