name: Deployment files

# The Quadlet units of the previous production stack, validated through a Podman container only
# when they or their tooling change.
on:
  pull_request:
    paths:
      - deploy/**
      - tools/validate-quadlets.sh
      - tools/deployment/**
      - .github/workflows/deployment.yml
  push:
    branches: [main]
    paths:
      - deploy/**
      - tools/validate-quadlets.sh
      - tools/deployment/**
      - .github/workflows/deployment.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quadlets:
    name: Validate Quadlets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            deploy
            tools

      - name: Validate Quadlets
        run: bash tools/validate-quadlets.sh

      - name: Test deployment files
        run: python3 -m unittest discover -s tools/deployment -p 'test_*.py'
